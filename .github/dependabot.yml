version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    boto-group:
      patterns:
        - "boto3"
        - "botocore"
        - "aiobotocore"
    k8s-group:
      patterns:
        - "apache-airflow-providers-cncf-kubernetes"
        - "kubernetes"
    fs-group:
      patterns:
        - "fsspec"
        - "s3fs"
    airflow-group:
      patterns:
        - "apache-airflow"
        - "apache-airflow-providers-celery"
